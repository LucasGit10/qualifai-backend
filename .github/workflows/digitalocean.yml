name: Deploy Backend to DigitalOcean

on:
  push:
    branches:
      - feature-billing
  workflow_dispatch:

# Permissões necessárias para publicar no GHCR
permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      image_name: ${{ steps.prep.outputs.image_name }}
    steps:
      - name: Checkout do código
        uses: actions/checkout@v3

      - name: Preparar nome da imagem
        id: prep
        run: |
          REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "image_name=$REPO_LOWER" >> $GITHUB_OUTPUT
          echo "IMAGE_NAME=$REPO_LOWER" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login no GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build e Push da imagem Docker
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: ghcr.io/${{ env.IMAGE_NAME }}-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.DO_BACKEND_IP }}
          username: root
          key: ${{ secrets.DO_SSH_KEY }}
          script: |
            mkdir -p /app
            cd /app
            
            # Login no GHCR no Droplet
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            
            echo "${{ secrets.BACKEND_ENV }}" > .env
            
            # --- CRIA O ARQUIVO DE PRODUÇÃO NA HORA ---
            cat <<EOF > docker-compose.yml
            services:
              backend:
                image: ghcr.io/${{ needs.build-and-push.outputs.image_name }}-backend:latest
                container_name: qualifai-backend
                restart: unless-stopped
                ports:
                  - "3001:3001"
                env_file:
                  - .env
            EOF
            
            echo "Fazendo pull da imagem nova..."
            docker compose pull
            
            echo "Subindo container..."
            docker compose up -d --remove-orphans
            
            echo "Limpando imagens antigas..."
            docker image prune -f
            
            docker ps
